<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- favicon -->
    <link rel="icon" type="image/svg+xml" href="/img/icons/svg/check-double-solid_dark.svg">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="CheckDev - пробные собеседования в IT.">
    <title th:text="${'Редактирование профиля ' + personDto.firstName + ' ' + personDto.lastName}">Редактирование профиля ИМЯ_ПРОФИЛЯ</title>

    <!-- Required meta tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- fontawesome-free-6.3.0-web -->
    <link th:href="@{/webjars/font-awesome/6.3.0/css/all.min.css}" rel="stylesheet">
    <!-- Bootstrap 5.3.2 -->
    <link th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}" rel="stylesheet">
    <script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.min.js}"></script>
    <!-- Popper.js 2.11.7 -->
    <script th:src="@{/webjars/popper.js/2.11.7/umd/popper.js}"></script>
    <!-- Jquery.js 3.7.1 -->
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <!-- Summernote 0.8.10 -->
    <link th:href="@{/webjars/summernote/0.8.10/summernote-lite.css}" rel="stylesheet">
    <script th:src="@{/webjars/summernote/0.8.10/summernote-lite.js}"></script>
    <script th:src="@{/webjars/summernote/0.8.10/lang/summernote-ru-RU.js}"></script>
</head>
<body>
<div th:insert="fragments/header :: header"></div>
<div class="container">
    <div class="row pb-3">
        <div class="cell">
            <div class="card">
                <h5 class="card-header">Редактирование пользователя</h5>
                <div class="card-body">
                    <form th:action="@{/persons/edit}" method="POST" th:object="${personDto}"
                          enctype="multipart/form-data">
                        <input type="hidden" name="id" th:field="*{id}">
                        <input type="hidden" name="photo" th:field="*{photo.id}">
                        <div class="row mb-3">
                            <div class="col-9">
                                <!--FirstName-->
                                <div class="mb-3">
                                    <label for="firstName" class="form-label"><b>Имя</b></label>
                                    <input type="text" class="form-control" id="firstName" name="firstName"
                                           th:field="*{firstName}" placeholder="Введите имя">
                                </div>
                                <!--LastName-->
                                <div class="mb-3">
                                    <label for="lastName" class="form-label"><b>Фамилия</b></label>
                                    <input type="text" class="form-control" id="lastName" name="lastName"
                                           th:field="*{lastName}" placeholder="Введите фамилию">
                                </div>
                                <!--Email-->
                                <div class="mb-3">
                                    <label class="form-label" for="email"><b>Email</b></label>
                                    <input class="form-control" id="email" name="email" placeholder="Email"
                                           th:field="*{email}"
                                           type="email">
                                </div>
                                <!--Experience-->
                                <div class="mb-3">
                                    <label class="form-label" for="experience"><b>Опыт</b></label>
                                    <textarea class="form-control"
                                              id="experience"
                                              name="experience" placeholder="Опыт" rows="5"
                                              th:field="*{experience}"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="salary"><b>Ожидаемый доход</b></label>
                                    <input class="form-control" id="salary" name="salary" th:field="*{salary}"
                                           type="text">
                                </div>
                                <div class="mb-3">
                                    <label for="location"><b>Город</b></label>
                                    <input class="form-control" id="location" name="location" placeholder="Город"
                                           th:field="*{location}" type="text">
                                </div>
                            </div>
                        </div>
                        <a class="btn btn-secondary mt-3"
                           th:href="@{/}">Отмена</a>
                        <button class="btn btn-success mt-3" type="submit">Обновить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:insert="fragments/footer :: footer"></div>
</body>
</html>
